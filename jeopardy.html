<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Aviation Maintenance Jeopardy</title>
    <style>
        body { font-family: sans-serif; background-color: #060ce9; color: white; text-align: center; margin: 0; }
        .board { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; padding: 20px; }
        .column-title { font-weight: bold; padding: 10px; background: #000; border-bottom: 5px solid #ffcc00; }
        .tile { background: #060ce9; border: 2px solid #ffcc00; padding: 30px; font-size: 24px; font-weight: bold; cursor: pointer; color: #ffcc00; }
        .tile:hover { background: #1a20ff; }
        
        #overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #060ce9; z-index: 100; flex-direction: column; justify-content: center; align-items: center; padding: 40px; }
        #question-text { font-size: 32px; margin-bottom: 20px; }
        #answer-text { font-size: 28px; color: #ffcc00; display: none; margin-top: 20px; }
        .btn { padding: 15px 30px; font-size: 20px; cursor: pointer; background: #ffcc00; border: none; border-radius: 5px; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="board" id="board">
        <!-- Headers -->
        <div class="column-title">Math</div>
        <div class="column-title">Physics</div>
        <div class="column-title">FARs</div>
        <div class="column-title">Maintenance Documents</div>
        <div class="column-title">Human Factors</div>

        <!-- Tiles (Example row) -->
        <div class="tile" onclick="showQ('Math', '100', 'Question: If you have a total weight of 1,200 lbs and a CG of 35.0 inches, what is the moment?', 'Answer: 42,000 inch-pounds')">$100</div>
        <div class="tile" onclick="showQ('Physics', '100', 'Question: Which gas law states that volume is inversely proportional to pressure?', 'Answer: Boyle\'s Law')">$100</div>
        <div class="tile" onclick="showQ('FARs', '100', 'Question: What Part of the FARs governs the certification of mechanics?', 'Answer: Part 65')">$100</div>
        <div class="tile" onclick="showQ('Maintenance Documents', '100', 'Question: What form is used for an major repair or alteration?', 'Answer: FAA Form 337')">$100</div>
        <div class="tile" onclick="showQ('Human Factors', '100', 'Question: Which of the "Dirty Dozen" involves not completing a task properly?', 'Answer: Lack of Completion')">$100</div>
        
        <!-- Add more rows here as needed -->
    </div>

    <div id="overlay">
        <div id="question-text"></div>
        <button class="btn" id="reveal-btn" onclick="document.getElementById('answer-text').style.display='block'">Show Answer</button>
        <div id="answer-text"></div>
        <button class="btn" onclick="closeQ()">Return to Board</button>
    </div>

    <script>
        function showQ(cat, val, q, a) {
            document.getElementById('question-text').innerText = q;
            document.getElementById('answer-text').innerText = a;
            document.getElementById('answer-text').style.display = 'none';
            document.getElementById('overlay').style.display = 'flex';
        }
        function closeQ() {
            document.getElementById('overlay').style.display = 'none';
        }
    </script>
</body>
</html>
